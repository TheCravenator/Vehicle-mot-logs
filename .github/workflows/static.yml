# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Improve registration OCR for the deployed app
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = re.compile(r'function findRegistration\(t\)\{.*?\}\nfunction findMakeModel', re.S)
          new = r'''function findRegistration(t){
          const raw=cleanText(t).toUpperCase();
          const a=lines(raw);
          const normalize=s=>String(s||"").toUpperCase().replace(/[|]/g," ").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
          const fixCandidate=s=>{
            let x=normalize(s).replace(/\s+/g,"");
            if(x.length<7||x.length>8)return "";
            if(x.length===7)x=x.slice(0,4)+" "+x.slice(4);
            const chars=x.replace(/ /g,"").split("");
            const letterFix={"0":"O","1":"I","2":"Z","5":"S","8":"B"};
            const digitFix={"O":"0","Q":"0","D":"0","I":"1","L":"1","Z":"2","S":"5","G":"6","B":"8"};
            for(let i=0;i<chars.length;i++){
              if(i<2||i>=4){if(letterFix[chars[i]])chars[i]=letterFix[chars[i]]}
              else if(i>=2&&i<4){if(digitFix[chars[i]])chars[i]=digitFix[chars[i]]}
            }
            const z=chars.join("");
            if(!/^[A-HJ-NP-Z]{2}\d{2}[A-HJ-NP-Z]{3}$/.test(z))return "";
            return z.slice(0,4)+" "+z.slice(4);
          };
          const candidates=[];
          const add=(text,score)=>{
            const n=normalize(text).replace(/\s+/g,"");
            const variants=[n,n.replace(/[^A-Z0-9]/g,"")];
            for(const v of variants){const r=fixCandidate(v);if(r)candidates.push({r,score});}
          };
          for(let i=0;i<a.length;i++){
            if(/\b(REGISTRATION|REG\.?\s*(NO|NUMBER)?|VRM|VEHICLE\s+REGISTRATION)\b/i.test(a[i])){
              add(a[i].replace(/^.*?\b(?:REGISTRATION|REG\.?\s*(?:NO|NUMBER)?|VRM|VEHICLE\s+REGISTRATION)\b\s*[:#=-]?\s*/i,""),120);
              if(a[i+1])add(a[i+1],115);
            }
          }
          const compact=raw.replace(/\s+/g," ");
          const re=/\b([A-Z0-9]{2}\s?[A-Z0-9]{2}\s?[A-Z0-9]{3})\b/g;
          let m;
          while((m=re.exec(compact)))add(m[1],80);
          for(const line of a){const tokens=line.split(/\s+/);for(let i=0;i<tokens.length;i++){for(let n=1;n<=3&&i+n<=tokens.length;n++)add(tokens.slice(i,i+n).join(" "),60-n*3);}}
          candidates.sort((x,y)=>y.score-x.score);
          return candidates.length?candidates[0].r:"";
          }
          function findMakeModel'''
          if not old.search(s): raise SystemExit('findRegistration block not found')
          p.write_text(old.sub(new,s,count=1),encoding='utf-8')

      - name: Add import and export controls
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<button class="scan" onclick="openScanner()">📷 Scan vehicle</button>'
          controls=marker+'<button class="plain" onclick="exportData()">⬇️ Export</button><button class="plain" onclick="importData()">⬆️ Import</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="handleImport(event)">'
          if 'onclick="exportData()"' not in s:
              if marker not in s: raise SystemExit('toolbar marker not found')
              s=s.replace(marker,controls,1)
          funcs=r'''
          function exportData(){
            const payload={app:"Vehicle MOT Logs",version:1,exportedAt:new Date().toISOString(),vehicles:data};
            const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
            const url=URL.createObjectURL(blob);const a=document.createElement("a");
            a.href=url;a.download="vehicle-mot-logs-"+new Date().toISOString().slice(0,10)+".json";
            document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
          }
          function importData(){$("importFile").value="";$('importFile').click()}
          function handleImport(event){
            const file=event.target.files&&event.target.files[0];if(!file)return;
            const reader=new FileReader();reader.onload=()=>{try{
              const parsed=JSON.parse(reader.result),imported=Array.isArray(parsed)?parsed:parsed.vehicles;
              if(!Array.isArray(imported))throw Error("The file does not contain a vehicle list.");
              const valid=imported.filter(v=>v&&typeof v==="object"&&typeof v.reg==="string"&&typeof v.model==="string"&&typeof v.date==="string").map(v=>({
                id:String(v.id||(Date.now()+Math.random())),reg:v.reg.trim().toUpperCase(),model:v.model.trim(),date:v.date,
                status:["auto","booked","current"].includes(v.status)?v.status:"auto"
              }));
              if(imported.length&&!valid.length)throw Error("No valid vehicle records were found.");
              if(!confirm("Import "+valid.length+" vehicle"+(valid.length===1?"":"s")+"?\n\nThis will replace the current vehicle list."))return;
              data=valid;persist();alert("Import complete — "+valid.length+" vehicle"+(valid.length===1?"":"s")+" loaded.");
            }catch(e){alert("Import failed: "+(e.message||"Invalid JSON file."));}};
            reader.onerror=()=>alert("Import failed: the file could not be read.");reader.readAsText(file);
          }
          '''
          if 'function exportData()' not in s:
              s=s.replace('render();',funcs+'\nrender();',1)
          p.write_text(s,encoding='utf-8')

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

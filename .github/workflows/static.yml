# Deploy Vehicle MOT Logs to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add four equal priority summary cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}', '.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}', 1)
          s = s.replace('@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.card:last-child{grid-column:1/-1}.row{grid-template-columns:1fr}.days{text-align:left}}', '@media(max-width:720px){.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.days{text-align:left}}', 1)
          old_cards = '<div class="cards"><div class="card"><div class="num" id="priority">0</div><div class="label">To book · 100 days or less</div></div><div class="card"><div class="num" id="booked">0</div><div class="label">Booked</div></div><div class="card"><div class="num" id="total">0</div><div class="label">Vehicles logged</div></div></div>'
          new_cards = '<div class="cards"><div class="card"><div class="num" id="priority">0</div><div class="label">To book · 100 days or less</div></div><div class="card"><div class="num" id="booked">0</div><div class="label">Booked</div></div><div class="card"><div class="num" id="within200">0</div><div class="label">200 days or less</div></div><div class="card"><div class="num" id="total">0</div><div class="label">Vehicles logged</div></div></div>'
          if old_cards in s:
              s = s.replace(old_cards, new_cards, 1)
          old_render = '$("total").textContent=data.length;$("priority").textContent=data.filter(v=>days(v.date)<=100).length;$("booked").textContent=data.filter(v=>state(v)==="booked").length;'
          new_render = '$("total").textContent=data.length;$("priority").textContent=data.filter(v=>days(v.date)<=100).length;$("booked").textContent=data.filter(v=>state(v)==="booked").length;$("within200").textContent=data.filter(v=>days(v.date)<=200).length;'
          if old_render in s:
              s = s.replace(old_render, new_render, 1)
          p.write_text(s, encoding='utf-8')

      - name: Save the card layout change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add 200-day priority card [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

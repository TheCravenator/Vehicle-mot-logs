# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Improve registration OCR for the deployed app
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = re.compile(r'function findRegistration\(t\)\{.*?\}\nfunction findMakeModel', re.S)
          new = r'''function findRegistration(t){
          const raw=cleanText(t).toUpperCase();
          const a=lines(raw);
          const normalize=s=>String(s||"").toUpperCase().replace(/[|]/g," ").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
          const fixCandidate=s=>{
            let x=normalize(s).replace(/\s+/g,"");
            if(x.length<7||x.length>8)return "";
            if(x.length===7)x=x.slice(0,4)+" "+x.slice(4);
            const chars=x.replace(/ /g,"").split("");
            const letterFix={"0":"O","1":"I","2":"Z","5":"S","8":"B"};
            const digitFix={"O":"0","Q":"0","D":"0","I":"1","L":"1","Z":"2","S":"5","G":"6","B":"8"};
            for(let i=0;i<chars.length;i++){
              if(i<2||i>=4){if(letterFix[chars[i]])chars[i]=letterFix[chars[i]]}
              else if(i>=2&&i<4){if(digitFix[chars[i]])chars[i]=digitFix[chars[i]]}
            }
            const z=chars.join("");
            if(!/^[A-HJ-NP-Z]{2}\d{2}[A-HJ-NP-Z]{3}$/.test(z))return "";
            return z.slice(0,4)+" "+z.slice(4);
          };
          const candidates=[];
          const add=(text,score)=>{
            const n=normalize(text).replace(/\s+/g,"");
            const variants=[n,n.replace(/[^A-Z0-9]/g,"")];
            for(const v of variants){
              const r=fixCandidate(v);
              if(r)candidates.push({r,score});
            }
          };
          // Strongest signal: an explicit Registration/Reg/VRM label and the value beside or below it.
          for(let i=0;i<a.length;i++){
            if(/\b(REGISTRATION|REG\.?\s*(NO|NUMBER)?|VRM|VEHICLE\s+REGISTRATION)\b/i.test(a[i])){
              add(a[i].replace(/^.*?\b(?:REGISTRATION|REG\.?\s*(?:NO|NUMBER)?|VRM|VEHICLE\s+REGISTRATION)\b\s*[:#=-]?\s*/i,""),120);
              if(a[i+1])add(a[i+1],115);
            }
          }
          // UK registration pattern anywhere in the OCR text.
          const compact=raw.replace(/\s+/g," ");
          const re=/\b([A-Z0-9]{2}\s?[A-Z0-9]{2}\s?[A-Z0-9]{3})\b/g;
          let m;
          while((m=re.exec(compact)))add(m[1],80);
          // OCR often separates the plate into two or three chunks, so test short neighbouring chunks too.
          for(const line of a){
            const tokens=line.split(/\s+/);
            for(let i=0;i<tokens.length;i++){
              for(let n=1;n<=3&&i+n<=tokens.length;n++)add(tokens.slice(i,i+n).join(" "),60-n*3);
            }
          }
          candidates.sort((x,y)=>y.score-x.score);
          return candidates.length?candidates[0].r:"";
          }
          function findMakeModel'''
          if not old.search(s):
              raise SystemExit('findRegistration block not found')
          p.write_text(old.sub(new,s,count=1),encoding='utf-8')
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

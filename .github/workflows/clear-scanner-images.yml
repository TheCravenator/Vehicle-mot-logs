name: Clear scanner screenshots after saving

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch scanner reset
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_open = 'function openScanner(){$("scanModal").classList.add("open");$("progress").style.display="none";$("result").style.display="none";$("rawText").textContent="Nothing read yet.";$("sreg").value=$("smake").value=$("smodel").value=$("sdate").value=""}'
          new_open = 'function resetScanner(){$("img1").value="";$("img2").value="";$("p1").src="";$("p2").src="";$("p1").style.display="none";$("p2").style.display="none";$("progress").style.display="none";$("result").style.display="none";$("rawText").textContent="Nothing read yet.";$("sreg").value=$("smake").value=$("smodel").value=$("sdate").value=""}function openScanner(){resetScanner();$("scanModal").classList.add("open")}'
          if old_open not in s:
              raise SystemExit("Could not find scanner open function")
          s = s.replace(old_open, new_open, 1)

          old_save = 'data.push({id:String(Date.now())+Math.random(),reg,model:make+" "+model,date,status:"auto"});closeScan();persist()}'
          new_save = 'data.push({id:String(Date.now())+Math.random(),reg,model:make+" "+model,date,status:"auto"});resetScanner();closeScan();persist()}'
          if old_save not in s:
              raise SystemExit("Could not find scanner save function")
          s = s.replace(old_save, new_save, 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/clear-scanner-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/clear-scanner-images.yml
          git commit -m "Clear scanner screenshots after saving [skip ci]"
          git push

name: Fix duplicate protection patch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix duplicate protection formatting
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(r'\\nfunction regKey', '\nfunction regKey')
          s = s.replace(r'\\nfunction duplicateRegistration', '\nfunction duplicateRegistration')
          s = s.replace(r'\\nfunction duplicateMessage', '\nfunction duplicateMessage')
          if 'function regKey(r)' not in s or 'duplicateRegistration(reg,edit)' not in s:
              raise SystemExit("Duplicate protection code is missing")
          p.write_text(s, encoding="utf-8")

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix duplicate protection formatting [skip ci]"
          git push
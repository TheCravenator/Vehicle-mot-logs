name: Centre title subtitle
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  centre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centre subtitle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='header{background:linear-gradient(135deg,#06334d,#087eb5);color:#fff;padding:25px 18px 18px}'
          new='header{background:linear-gradient(135deg,#06334d,#087eb5);color:#fff;padding:25px 18px 18px;text-align:center}'
          if old not in s:
              raise SystemExit('header CSS marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and remove patch workflow
        shell: bash
        run: |
          rm -f .github/workflows/centre-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/centre-banner.yml
          git diff --cached --quiet || git commit -m "Centre title banner subtitle"
          git push

name: Add search button to Vehicle MOT Logs

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch-search-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add search button and forgiving registration search
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<input class="search" id="search" placeholder="Search registration or model…"><button class="add" onclick="add()">＋ Add</button>'
          new = '<input class="search" id="search" placeholder="Search registration or model…"><button class="plain searchBtn" onclick="focusSearch()" aria-label="Search vehicles">🔎 Search</button><button class="add" onclick="add()">＋ Add</button>'
          if old in s and 'class="plain searchBtn"' not in s:
              s = s.replace(old, new, 1)

          css_old = '.search{flex:1;min-width:180px}'
          css_new = '.search{flex:1;min-width:180px}.searchBtn{white-space:nowrap}'
          if css_old in s and '.searchBtn' not in s:
              s = s.replace(css_old, css_new, 1)

          js_old = 'function render(){const q=$("search").value.toLowerCase().trim(),vs=data.filter(v=>(v.reg+" "+v.model).toLowerCase().includes(q)).sort((a,b)=>days(a.date)-days(b.date));'
          js_new = 'function focusSearch(){$("search").focus();$("search").select()}function render(){const raw=$("search").value.toLowerCase().trim(),q=raw.replace(/\\s+/g,""),vs=data.filter(v=>{const reg=String(v.reg||"").toLowerCase().replace(/[^a-z0-9]/g,"");const text=(v.reg+" "+v.model).toLowerCase();return reg.includes(q.replace(/[^a-z0-9]/g,""))||text.includes(raw)}).sort((a,b)=>days(a.date)-days(b.date));'
          if js_old in s and 'function focusSearch()' not in s:
              s = s.replace(js_old, js_new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit app change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Search UI already patched"
          else
            git commit -m "Add vehicle search button and flexible registration search"
            git push
          fi
      - name: Remove one-time patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-search-button.yml
          git commit -m "Remove one-time search patch workflow"
          git push

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vehicle MOT Logs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#152235;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#09233d,#1167c9);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 20px}
h1{margin:0;font-size:27px}.sub{opacity:.8;margin-top:3px;font-size:13px}
main{max-width:900px;margin:auto;padding:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 16px #18314a12}.num{font-size:27px;font-weight:850}.label{font-size:12px;color:#687587}
.toolbar{display:flex;gap:9px;margin:14px 0}.search{flex:1;border:1px solid #dce3ec;border-radius:12px;padding:12px;background:#fff;font-size:15px}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:750;font-size:14px}.add{background:#1167c9;color:#fff}.plain{background:#fff;border:1px solid #dce3ec;color:#152235}
.list{display:grid;gap:10px}.row{background:#fff;border:1px solid #e1e7ee;border-radius:17px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:8px;box-shadow:0 3px 12px #18314a0b}
.reg{font-weight:850;font-size:18px;letter-spacing:.3px}.model{color:#687587;font-size:14px;margin-top:3px}.due{font-size:12px;color:#778396;margin-top:8px}
.days{font-size:24px;font-weight:900;text-align:right}.days small{display:block;font-size:11px;color:#778396;font-weight:650}
.badge{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:850}.urgent{background:#fff0d7;color:#9a5b00}.booked{background:#e5efff;color:#2355b5}.current{background:#e2f7ed;color:#087347}.expired{background:#ffe5e7;color:#b4232a}
.actions{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:9px 11px}
.empty{text-align:center;color:#748196;padding:50px 20px}.hint{text-align:center;color:#7b8797;font-size:12px;margin-top:16px}
.modal{position:fixed;inset:0;background:#07152599;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.open{display:flex}.sheet{background:#fff;border-radius:22px 22px 16px 16px;padding:20px;width:min(560px,100%);box-shadow:0 -8px 35px #0002}
.sheet h2{margin:0 0 12px}.field{margin:11px 0}.field label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #dce3ec;border-radius:11px;font-size:15px}.sheetActions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.card:last-child{grid-column:1/-1}.toolbar{flex-wrap:wrap}.search{min-width:100%}}
</style>
</head>
<body>
<header><h1>🚗 Vehicle MOT Logs</h1><div class="sub">Your personal MOT priority list</div></header>
<main>
<div class="cards">
<div class="card"><div class="num" id="priority">0</div><div class="label">To book · 100 days or less</div></div>
<div class="card"><div class="num" id="booked">0</div><div class="label">Booked</div></div>
<div class="card"><div class="num" id="total">0</div><div class="label">Vehicles logged</div></div>
</div>
<div class="toolbar"><input class="search" id="search" placeholder="Search registration or model…"><button class="add" onclick="add()">＋ Add</button></div>
<div class="list" id="list"></div>
<div class="hint">Data is kept on this device in this browser.</div>
</main>

<div class="modal" id="modal"><div class="sheet">
<h2 id="title">Add vehicle</h2>
<div class="field"><label>Registration</label><input id="reg" autocapitalize="characters" placeholder="AB12 CDE"></div>
<div class="field"><label>Model</label><input id="model" placeholder="Ford Focus"></div>
<div class="field"><label>MOT due date</label><input id="date" type="date"></div>
<div class="field"><label>Status</label><select id="status"><option value="auto">Automatic</option><option value="booked">Booked</option><option value="current">Current</option></select></div>
<div class="sheetActions"><button class="plain" onclick="closeModal()">Cancel</button><button class="add" onclick="saveVehicle()">Save</button></div>
</div></div>

<script>
const KEY="vehicle-mot-logs-personal-v2";let data=JSON.parse(localStorage.getItem(KEY)||"[]"),edit=null;
const $=id=>document.getElementById(id);
function days(x){let a=new Date();a.setHours(0,0,0,0);let b=new Date(x+"T00:00:00");return Math.ceil((b-a)/86400000)}
function calc(v){let d=days(v.date);if(d<0)return"expired";if(v.status==="booked")return"booked";if(v.status==="current")return"current";return d<=100?"urgent":"current"}
function label(s){return{s:""}[s]||({expired:"MOT EXPIRED",urgent:"TO BOOK",booked:"BOOKED",current:"CURRENT"}[s])}
function fmt(x){return new Date(x+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"})}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){
 let q=$("search").value.toLowerCase().trim(), arr=data.filter(v=>(v.reg+" "+v.model).toLowerCase().includes(q)).sort((a,b)=>days(a.date)-days(b.date));
 $("total").textContent=data.length;$("priority").textContent=data.filter(v=>days(v.date)<=100).length;$("booked").textContent=data.filter(v=>calc(v)==="booked").length;
 if(!arr.length){$("list").innerHTML='<div class="empty">No vehicles logged yet.<br><br>Tap <b>＋ Add</b> to enter the first one.</div>';return}
 $("list").innerHTML=arr.map(v=>{let d=days(v.date),s=calc(v),dt=d<0?Math.abs(d)+" days overdue":d+" days";return `<div class="row">
 <div><div class="reg">${esc(v.reg)}</div><div class="model">${esc(v.model)}</div><span class="badge ${s}">${label(s)}</span><div class="due">MOT due ${fmt(v.date)}</div></div>
 <div class="days">${dt}<small>remaining</small></div>
 <div class="actions"><button class="plain" onclick="editVehicle('${v.id}')">Edit</button>
 ${s==="urgent"?`<button class="add" onclick="book('${v.id}')">Mark booked</button>`:""}
 ${s==="booked"?`<button class="add" onclick="complete('${v.id}')">MOT completed</button>`:""}
 <button class="plain" onclick="del('${v.id}')">Delete</button></div></div>`}).join("")
}
function add(){edit=null;$("title").textContent="Add vehicle";$("reg").value="";$("model").value="";$("date").value="";$("status").value="auto";$("modal").classList.add("open")}
function editVehicle(id){let v=data.find(x=>x.id===id);edit=id;$("title").textContent="Edit vehicle";$("reg").value=v.reg;$("model").value=v.model;$("date").value=v.date;$("status").value=v.status;$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open")}
function saveVehicle(){let reg=$("reg").value.trim().toUpperCase(),model=$("model").value.trim(),date=$("date").value,status=$("status").value;if(!reg||!model||!date){alert("Please enter registration, model and MOT due date.");return}
 if(edit){let v=data.find(x=>x.id===edit);Object.assign(v,{reg,model,date,status})}else data.push({id:Date.now().toString(),reg,model,date,status});closeModal();persist()}
function book(id){let v=data.find(x=>x.id===id);v.status="booked";persist()}
function complete(id){let v=data.find(x=>x.id===id),d=prompt("Enter the new MOT due date (YYYY-MM-DD):",v.date);if(d&&/^\\d{4}-\\d{2}-\\d{2}$/.test(d)){v.date=d;v.status="auto";persist()}}
function del(id){if(confirm("Delete this vehicle?")){data=data.filter(v=>v.id!==id);persist()}}
$("search").addEventListener("input",render);render();
</script>
</body></html>
